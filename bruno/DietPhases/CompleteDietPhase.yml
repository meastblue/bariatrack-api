info:
  name: CompleteDietPhase
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation CompleteDietPhase($id: UUID!, $endedAt: String) { completeDietPhase(id: $id, endedAt: $endedAt) { id status endedAt } }",
        "variables": {
          "id": "{{diet_phase_id}}",
          "endedAt": "2026-03-08"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
