info:
  name: MyPatient
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query MyPatient { myPatient { id profileId surgeryType surgeryDate initialWeightKg targetWeightKg heightCm gender bloodType primaryDoctorId allergies notes createdAt updatedAt } }"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { myPatient } = res.body.data;
        if (myPatient) bru.setVar("patient_id", myPatient.id);

settings:
  encodeUrl: true
