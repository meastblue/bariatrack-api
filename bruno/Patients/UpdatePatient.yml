info:
  name: UpdatePatient
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation UpdatePatient($id: UUID!, $data: UpdatePatientInput!) { updatePatient(id: $id, data: $data) { id targetWeightKg notes updatedAt } }",
        "variables": {
          "id": "{{patient_id}}",
          "data": {
            "targetWeightKg": 72.0,
            "notes": "Objectif révisé après consultation"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
