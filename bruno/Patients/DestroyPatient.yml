info:
  name: DestroyPatient
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation DestroyPatient($id: UUID!) { destroyPatient(id: $id) }",
        "variables": { "id": "{{patient_id}}" }
      }
  auth: inherit

settings:
  encodeUrl: true
