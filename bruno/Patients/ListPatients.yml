info:
  name: ListPatients (admin)
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query ListPatients { patients { id profileId surgeryType surgeryDate initialWeightKg heightCm createdAt } }"
      }
  auth: inherit

settings:
  encodeUrl: true
