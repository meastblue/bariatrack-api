info:
  name: CreatePatient
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation CreatePatient($data: CreatePatientInput!) { createPatient(data: $data) { id profileId surgeryType surgeryDate initialWeightKg targetWeightKg heightCm gender bloodType createdAt } }",
        "variables": {
          "data": {
            "surgeryType": "SLEEVE_GASTRECTOMY",
            "surgeryDate": "2025-06-15",
            "initialWeightKg": 120.5,
            "heightCm": 175.0,
            "targetWeightKg": 75.0,
            "gender": "MALE",
            "bloodType": "O_POS"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { createPatient } = res.body.data;
        bru.setVar("patient_id", createPatient.id);

settings:
  encodeUrl: true
