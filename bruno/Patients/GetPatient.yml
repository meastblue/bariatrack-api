info:
  name: GetPatient
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    mode: json
    json: |
      {
        "query": "query GetPatient($id: UUID!) { patient(id: $id) { id profileId surgeryType surgeryDate initialWeightKg targetWeightKg heightCm dateOfBirth gender bloodType primaryDoctorId allergies notes createdAt updatedAt } }",
        "variables": {
          "id": "{{patient_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
