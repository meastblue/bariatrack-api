info:
  name: AssignTask
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation AssignTask($patientId: UUID!, $taskId: UUID!, $assignedAt: String) { assignTask(patientId: $patientId, taskId: $taskId, assignedAt: $assignedAt) { id taskId patientId status assignedAt createdAt } }",
        "variables": {
          "patientId": "{{patient_id}}",
          "taskId": "{{task_id}}",
          "assignedAt": "2026-03-08"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
