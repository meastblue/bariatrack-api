info:
  name: Weight
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query Weight($id: UUID!) { weight(id: $id) { id patientId weightKg measuredAt source note createdAt } }",
        "variables": {
          "id": "00000000-0000-0000-0000-000000000000"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
