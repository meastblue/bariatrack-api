info:
  name: MyWeights
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query MyWeights($limit: Int, $offset: Int) { myWeights(limit: $limit, offset: $offset) { id patientId weightKg measuredAt source note createdAt } }",
        "variables": {
          "limit": 20,
          "offset": 0
        }
      }
  auth: inherit

settings:
  encodeUrl: true
