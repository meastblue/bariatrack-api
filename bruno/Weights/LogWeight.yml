info:
  name: LogWeight
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation LogWeight($data: LogWeightInput!) { logWeight(data: $data) { id patientId weightKg measuredAt source note createdAt } }",
        "variables": {
          "data": {
            "weightKg": 95.5,
            "measuredAt": "2026-03-08",
            "source": "MANUAL",
            "note": "Pesée du matin"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { logWeight } = res.body.data;
        if (logWeight) bru.setVar("weight_id", logWeight.id);

settings:
  encodeUrl: true
