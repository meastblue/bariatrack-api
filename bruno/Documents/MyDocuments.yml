info:
  name: MyDocuments
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query MyDocuments { myDocuments { id patientId uploadedBy appointmentId title description fileUrl fileType mimeType fileSizeBytes uploadedAt } }",
        "variables": {}
      }
  auth: inherit

settings:
  encodeUrl: true
