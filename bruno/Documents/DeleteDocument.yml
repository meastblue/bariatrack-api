info:
  name: DeleteDocument
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation DeleteDocument($id: UUID!) { deleteDocument(id: $id) }",
        "variables": {
          "id": "{{document_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
