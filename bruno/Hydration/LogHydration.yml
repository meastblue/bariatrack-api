info:
  name: LogHydration
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation LogHydration($data: LogHydrationInput!) { logHydration(data: $data) { id patientId totalMl goalMl loggedAt source createdAt } }",
        "variables": {
          "data": {
            "totalMl": 1800,
            "goalMl": 2000,
            "loggedAt": "2026-03-08",
            "source": "MANUAL"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { logHydration } = res.body.data;
        if (logHydration) bru.setVar("hydration_id", logHydration.id);

settings:
  encodeUrl: true
