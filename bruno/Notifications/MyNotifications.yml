info:
  name: MyNotifications
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query MyNotifications($unreadOnly: Boolean) { myNotifications(unreadOnly: $unreadOnly) { id title body isRead notificationType relatedEntityId relatedEntityType createdAt } }",
        "variables": {
          "unreadOnly": false
        }
      }
  auth: inherit

settings:
  encodeUrl: true
