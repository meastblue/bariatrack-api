info:
  name: ListProfiles (admin)
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query ListProfiles($includeDeleted: Boolean) { listProfiles(includeDeleted: $includeDeleted) { id authUserId email role locale createdAt updatedAt deletedAt } }",
        "variables": { "includeDeleted": false }
      }
  auth: inherit

settings:
  encodeUrl: true
