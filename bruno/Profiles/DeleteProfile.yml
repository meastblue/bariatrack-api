info:
  name: DeleteProfile (soft)
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation DeleteProfile($id: UUID!) { deleteProfile(id: $id) { id deletedAt } }",
        "variables": {
          "id": "{{profile_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
