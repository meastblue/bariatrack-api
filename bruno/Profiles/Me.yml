info:
  name: Me
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query Me { me { id email role locale createdAt updatedAt } }"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body;
        bru.setVar("profile_id", data.data.me.id);

settings:
  encodeUrl: true
