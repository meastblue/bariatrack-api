info:
  name: DestroyProfile (hard — RGPD)
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "query": "mutation DestroyProfile($id: UUID!) { destroyProfile(id: $id) }",
        "variables": {
          "id": "{{profile_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
