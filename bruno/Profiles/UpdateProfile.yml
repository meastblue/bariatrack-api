info:
  name: UpdateProfile
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    mode: json
    json: |
      {
        "query": "mutation UpdateProfile($id: UUID!, $data: UpdateProfileInput!) { updateProfile(id: $id, data: $data) { id locale updatedAt } }",
        "variables": {
          "id": "{{profile_id}}",
          "data": { "locale": "fr" }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
