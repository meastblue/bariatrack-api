info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{supabase_url}}/auth/v1/token?grant_type=password"
  headers:
    - name: apiKey
      value: "{{supabase_publishable_key}}"
    - name: Content-Type
      value: application/json
  params:
    - name: grant_type
      value: password
      type: query
  body:
    type: json
    data: |-
      {
        "email": "test2@test.com",
        "password": "test1234"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body;

        bru.setVar("access_token", body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
