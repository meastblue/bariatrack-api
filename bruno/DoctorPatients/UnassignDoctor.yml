info:
  name: UnassignDoctor
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation UnassignDoctor($doctorId: UUID!, $patientId: UUID!) { unassignDoctor(doctorId: $doctorId, patientId: $patientId) { id doctorId patientId status endedAt } }",
        "variables": {
          "doctorId": "{{doctor_id}}",
          "patientId": "{{patient_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
