info:
  name: TransferPatient
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation TransferPatient($patientId: UUID!, $oldDoctorId: UUID!, $newDoctorId: UUID!, $note: String) { transferPatient(patientId: $patientId, oldDoctorId: $oldDoctorId, newDoctorId: $newDoctorId, note: $note) { id doctorId patientId status assignedAt transferNote } }",
        "variables": {
          "patientId": "{{patient_id}}",
          "oldDoctorId": "{{old_doctor_id}}",
          "newDoctorId": "{{new_doctor_id}}",
          "note": "Transfer to new specialist"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
