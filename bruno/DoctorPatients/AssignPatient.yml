info:
  name: AssignPatient
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation AssignPatient($patientId: UUID!) { assignPatient(patientId: $patientId) { id doctorId patientId status assignedAt } }",
        "variables": {
          "patientId": "{{patient_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
