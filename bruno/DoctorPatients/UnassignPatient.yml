info:
  name: UnassignPatient
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation UnassignPatient($patientId: UUID!) { unassignPatient(patientId: $patientId) { id doctorId patientId status endedAt } }",
        "variables": {
          "patientId": "{{patient_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
