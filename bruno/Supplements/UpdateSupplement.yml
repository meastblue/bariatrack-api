info:
  name: UpdateSupplement
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation UpdateSupplement($id: UUID!, $data: UpdateSupplementInput!) { updateSupplement(id: $id, data: $data) { id name dosage frequency isActive } }",
        "variables": {
          "id": "{{supplement_id}}",
          "data": {
            "dosage": "500 mcg",
            "isActive": true
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
