info:
  name: MySupplementLogs
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "query MySupplementLogs { mySupplementLogs { id supplementId takenAt } }"
      }
  auth: inherit

settings:
  encodeUrl: true
