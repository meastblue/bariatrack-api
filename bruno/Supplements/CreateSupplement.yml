info:
  name: CreateSupplement
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation CreateSupplement($data: CreateSupplementInput!) { createSupplement(data: $data) { id name dosage frequency isActive } }",
        "variables": {
          "data": {
            "name": "Vitamine D3",
            "dosage": "2000 UI",
            "frequency": "DAILY",
            "startedAt": "2026-03-08"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const { createSupplement } = res.body.data;
        bru.setVar("supplement_id", createSupplement.id);

settings:
  encodeUrl: true
