info:
  name: DeleteSupplement
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation DeleteSupplement($id: UUID!) { deleteSupplement(id: $id) }",
        "variables": {
          "id": "{{supplement_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
