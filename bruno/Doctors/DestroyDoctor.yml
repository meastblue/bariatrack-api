info:
  name: DestroyDoctor
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "query": "mutation DestroyDoctor($id: UUID!) { destroyDoctor(id: $id) }",
        "variables": { "id": "{{doctor_id}}" }
      }
  auth: inherit

settings:
  encodeUrl: true
