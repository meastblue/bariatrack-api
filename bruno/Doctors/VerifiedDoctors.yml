info:
  name: VerifiedDoctors
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    mode: json
    json: |
      {
        "query": "query VerifiedDoctors { verifiedDoctors { id specialty hospitalName timezone } }"
      }
  auth: inherit

settings:
  encodeUrl: true
