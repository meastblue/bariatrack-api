info:
  name: GetDoctor
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Authorization
      value: "Bearer {{access_token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "query": "query GetDoctor($id: UUID!) { doctor(id: $id) { id profileId specialty licenseNumber hospitalName phoneProfessional timezone isVerified createdAt updatedAt } }",
        "variables": {
          "id": "{{doctor_id}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
